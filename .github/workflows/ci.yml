name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint, Test, Race & Security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Verify Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files detected:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests with Race Detection
        run: go test -race -v -timeout 120s ./...

      - name: Run Fuzz Smoke Test
        run: go test -run=FuzzSSEStreamParser -fuzz=FuzzSSEStreamParser -fuzztime=10s -timeout 60s ./pkg/provider

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  cross-compile:
    name: Multi-Architecture Build Matrix
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build All Architectures
        run: |
          make build-all

      - name: Verify Binaries
        run: |
          ls -lh bin/
          file bin/*

      - name: QEMU ARMv7 Verification
        run: |
          qemu-arm bin/zerotwo-linux-armv7 -dry-run -m "CI ARMv7 Verification" < /dev/null

      - name: QEMU ARM64 Verification
        run: |
          qemu-aarch64 bin/zerotwo-linux-arm64 -dry-run -m "CI ARM64 Verification" < /dev/null
