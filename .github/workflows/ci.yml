name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint, Test, Race & Security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.23'
          check-latest: true
          cache: true

      - name: Verify Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files detected:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests with Race Detection
        run: go test -race -v -timeout 120s ./...

      - name: Run Fuzz Smoke Test
        run: go test -run=FuzzSSEStreamParser -fuzz=FuzzSSEStreamParser -fuzztime=10s -timeout 60s ./pkg/provider

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: 'go.mod'
          check-latest: true

  cross-compile:
    name: Multi-Architecture Build Matrix
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.23'
          check-latest: true
          cache: true

      - name: Install QEMU User Emulators
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user qemu-user-static

      - name: Build All Architectures
        run: |
          make build-all

      - name: Verify Binaries
        run: |
          ls -lh bin/
          file bin/*

      - name: QEMU ARMv7 Verification
        run: |
          QEMU_ARM=$(command -v qemu-arm || command -v qemu-arm-static)
          $QEMU_ARM bin/zerotwo-linux-armv7 -dry-run -m "CI ARMv7 Verification" < /dev/null

      - name: QEMU ARM64 Verification
        run: |
          QEMU_AARCH64=$(command -v qemu-aarch64 || command -v qemu-aarch64-static)
          $QEMU_AARCH64 bin/zerotwo-linux-arm64 -dry-run -m "CI ARM64 Verification" < /dev/null
