name: Feature Request
description: Suggest an idea or enhancement for ZeroTwo
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature! ZeroTwo maintains a strict **Zero External Dependencies** rule (Go standard library only).
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: stdlib-compliance
    attributes:
      label: Standard Library Implementation Feasibility
      description: How will this feature be implemented using the Go standard library only without adding dependencies to `go.mod`?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or features you've considered.
